name: Build Windows EXE  
  
on:  
  push:  
    tags:  
      - "v*"  
  workflow_dispatch:  
  
permissions:  
  contents: write  
  
jobs:  
  build-windows:  
    runs-on: windows-latest  
    steps:  
      - uses: actions/checkout@v4  
      - uses: actions/setup-python@v5  
        with:  
          python-version: "3.11"  
      - name: Install deps  
        run: |  
          python -m pip install --upgrade pip  
          pip install -r requirements.txt  
      - name: Build exe  
        run: |  
          pyinstaller --noconfirm --onefile --windowed --name "进销存管理系统" main.py  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: inventory-windows-exe  
          path: dist/进销存管理系统.exe  
      - name: Release  
        uses: softprops/action-gh-release@v2  
        if: startsWith(github.ref, 'refs/tags/')  
        with:  
          files: dist/进销存管理系统.exe  
